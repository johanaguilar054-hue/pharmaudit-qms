<!-- SCRIPT DEFINITIVO Y SEGURO -->
  <script>
    const SUPABASE_URL = 'https://wmtvlxjzzwwhtybccrpe.supabase.co'; 
    const SUPABASE_ANON_KEY = 'sb_publishable_i4A7rEjukekMlaCKjXWaNA_ze54EVjl';          
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    window.activeGxpUser = { id: 'b40e33f1-6196-4b51-bfcb-6604d6daff50', nombre_completo: 'Johan Aguilar', cargo: 'QA Lead' };

    window.cachedDocs = [
      { id: '1', codigo: 'PH-GPD-F0-01', titulo: 'Lista de Chequeo Batch y Liberación de PT', tipo: 'FORMATO', version: '2.0', estado: 'Vigente', created_at: '2026-10-15', archivo_url: '' },
      { id: '2', codigo: 'PH-GPD-F0-01', titulo: 'Lista de Chequeo Batch y Liberación de PT', tipo: 'FORMATO', version: '1.0', estado: 'Obsoleto', created_at: '2026-05-10', archivo_url: '' },
      { id: '3', codigo: 'SOP-PRO-012', titulo: 'Limpieza e Higienización de Áreas Limpias Class C', tipo: 'SOP', version: '2.1', estado: 'Vigente', created_at: '2026-09-01', archivo_url: '' },
      { id: '4', codigo: 'SOP-QA-001', titulo: 'Procedimiento de Manejo de Desviaciones y NC', tipo: 'SOP', version: '3.0', estado: 'Vigente', created_at: '2026-08-20', archivo_url: '' },
      { id: '5', codigo: 'PROT-VAL-088', titulo: 'Protocolo de Calificación de Desempeño (PQ) Autoclave', tipo: 'ESPECIFICACION', version: '1.0', estado: 'Vigente', created_at: '2026-07-11', archivo_url: '' }
    ];

    window.cachedCopias = [
      { id: 'c1', codigo_copia: 'COP-PH-GPD-F0-01-C01', documento_codigo: 'PH-GPD-F0-01', version: '2.0', area_destino: 'Planta de Producción', custodio: 'Carlos Mendoza', fecha_emision: '2026-10-16', estado: 'ACTIVA' },
      { id: 'c2', codigo_copia: 'COP-PH-GPD-F0-01-C02', documento_codigo: 'PH-GPD-F0-01', version: '1.0', area_destino: 'Laboratorio QC', custodio: 'Laura Restrepo', fecha_emision: '2026-05-11', estado: 'DESTRUIDA' },
      { id: 'c3', codigo_copia: 'COP-SOP-PRO-012-C01', documento_codigo: 'SOP-SOP-PRO-012', version: '2.1', area_destino: 'Bodega / Almacén', custodio: 'Johan Aguilar', fecha_emision: '2026-09-02', estado: 'ACTIVA' }
    ];

    window.selectedDocId = null;
    window.selectedDocForCopia = null;
    window.selectedDocForVersion = null;

    function toggleModal(id, show) {
      const m = document.getElementById(id);
      if (m) {
        if (show) m.classList.add('active'); else m.classList.remove('active');
      }
    }

    async function subirArchivoSupabase(fileInputId, codigoDoc, versionDoc) {
      const fileInput = document.getElementById(fileInputId);
      if (!fileInput || !fileInput.files || fileInput.files.length === 0) return ''; 

      const file = fileInput.files[0];
      const fileExt = file.name.split('.').pop();
      const fileName = `${codigoDoc}_v${versionDoc}_${Date.now()}.${fileExt}`;
      const filePath = `qms-files/${fileName}`;

      const { data, error } = await supabaseClient.storage.from('documentos-gxp').upload(filePath, file);
      if (error) {
        console.error('Error al subir a Supabase Storage:', error);
        alert('Error al adjuntar el archivo digital en la nube.');
        return '';
      }

      const { data: publicURLData } = supabaseClient.storage.from('documentos-gxp').getPublicUrl(filePath);
      return publicURLData.publicUrl;
    }

    function abrirPortal(user) {
      if (user) window.activeGxpUser = user;
      const loginView = document.getElementById('view-login');
      const portalView = document.getElementById('app-portal');
      
      if (loginView) loginView.style.display = 'none';
      if (portalView) portalView.style.display = 'block';
      
      const badge = document.getElementById('userBadge');
      if (badge) badge.innerText = `User: ${window.activeGxpUser.nombre_completo} (${window.activeGxpUser.cargo || 'QA Lead'})`;
      
      renderAllData();
    }

    function renderAllData() {
      const copiasActivas = window.cachedCopias.filter(c => c.estado === 'ACTIVA').length;

      const cntDocs = document.getElementById('cnt-docs');
      const cntCopias = document.getElementById('cnt-copias');
      if (cntDocs) cntDocs.innerText = window.cachedDocs.length;
      if (cntCopias) cntCopias.innerText = copiasActivas;

      const listDocs = document.getElementById('list-docs');
      if (listDocs) {
        listDocs.innerHTML = window.cachedDocs.map(d => {
          const downloadBtn = d.archivo_url 
            ? `<a href="${d.archivo_url}" target="_blank" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2 py-1 rounded text-[10px] font-bold border">📥 Adjunto</a>` 
            : `<span class="text-slate-400 text-[10px] italic">Sin adjunto</span>`;

          const isObsoleto = d.estado === 'Obsoleto';
          const isVigente = d.estado === 'Vigente';
          const badgeClass = isObsoleto ? 'bg-rose-100 text-rose-800' : (isVigente ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800');

          return `
            <div class="py-3 flex justify-between items-center ${isObsoleto ? 'opacity-60 bg-slate-50 p-2 rounded' : ''}">
              <div>
                <div class="flex items-center space-x-2">
                  <span class="font-mono font-bold text-cyan-700">${d.codigo}</span>
                  <span class="font-semibold text-slate-800">${d.titulo}</span>
                  <span class="bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded text-[10px] font-mono">${d.tipo || 'SOP'} v${d.version}</span>
                </div>
                <div class="mt-1 flex items-center space-x-2">
                  ${downloadBtn}
                  <button type="button" data-action="preview" data-id="${d.id}" class="btn-action bg-slate-100 hover:bg-slate-200 text-slate-800 px-2 py-1 rounded text-[10px] font-bold border cursor-pointer">
                    🖨️ Previsualizar / Exportar PDF
                  </button>
                  ${isVigente 
                    ? `<button type="button" data-action="emitir" data-id="${d.id}" data-code="${d.codigo}" data-ver="${d.version}" class="btn-action bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-300 px-2 py-1 rounded text-[10px] font-bold cursor-pointer">
                        📋 Emitir Copia Controlada
                      </button>` 
                    : ''
                  }
                </div>
              </div>
              <div class="flex items-center space-x-2">
                <span class="${badgeClass} px-2 py-0.5 rounded font-semibold text-[10px]">${d.estado}</span>
                ${!isObsoleto && !isVigente 
                  ? `<button type="button" data-action="sign" data-id="${d.id}" data-code="${d.codigo}" class="btn-action bg-cyan-600 hover:bg-cyan-700 text-white px-2 py-1 rounded text-[10px] font-bold shadow cursor-pointer">✍️ Estampar Firma</button>` 
                  : ''
                }
                ${isVigente
                  ? `<button type="button" data-action="version" data-id="${d.id}" data-code="${d.codigo}" data-ver="${d.version}" class="btn-action bg-amber-600 hover:bg-amber-700 text-white px-2 py-1 rounded text-[10px] font-bold shadow cursor-pointer">🔄 Nueva Versión</button>`
                  : ''
                }
              </div>
            </div>
          `;
        }).join('');
      }

      const listCopias = document.getElementById('list-copias-body');
      if (listCopias) {
        listCopias.innerHTML = window.cachedCopias.map(c => {
          let estadoClass = 'bg-emerald-100 text-emerald-800';
          if (c.estado === 'PENDIENTE DE RETIRO') estadoClass = 'bg-amber-100 text-amber-800 font-bold';
          if (c.estado === 'DESTRUIDA') estadoClass = 'bg-slate-100 text-slate-500 line-through';

          return `
            <tr class="hover:bg-slate-50">
              <td class="p-2 border font-bold text-amber-900">${c.codigo_copia}</td>
              <td class="p-2 border">${c.documento_codigo} <span class="text-slate-500 text-[10px]">v${c.version}</span></td>
              <td class="p-2 border">${c.area_destino}</td>
              <td class="p-2 border">${c.custodio}</td>
              <td class="p-2 border">${c.fecha_emision}</td>
              <td class="p-2 border"><span class="px-2 py-0.5 rounded text-[10px] ${estadoClass}">${c.estado}</span></td>
              <td class="p-2 border text-center">
                ${c.estado === 'ACTIVA' || c.estado === 'PENDIENTE DE RETIRO'
                  ? `<button type="button" data-action="destruir" data-id="${c.id}" class="btn-action bg-rose-600 hover:bg-rose-700 text-white px-2 py-0.5 rounded text-[10px] font-bold shadow cursor-pointer">
                      🔥 Registrar Destrucción
                    </button>`
                  : `<span class="text-slate-400 text-[10px]">Conciliado</span>`
                }
              </td>
            </tr>
          `;
        }).join('');
      }
    }

    function previewPdf(docId) {
      const targetDoc = window.cachedDocs.find(x => x.id === docId);
      if (!targetDoc) return;

      document.getElementById('pdfDocTitle').innerText = targetDoc.titulo;
      document.getElementById('pdfDocCode').innerText = targetDoc.codigo;
      document.getElementById('pdfDocVersion').innerText = targetDoc.version;
      document.getElementById('pdfDocDate').innerText = new Date().toLocaleDateString('es-CO');

      const wm = document.getElementById('pdfWatermark');
      if (targetDoc.estado === 'Vigente') {
        wm.innerText = 'COPIA CONTROLADA · VIGENTE';
        wm.className = 'watermark-text text-emerald-600';
      } else if (targetDoc.estado === 'Obsoleto') {
        wm.innerText = 'DOCUMENTO OBSOLETO';
        wm.className = 'watermark-text text-rose-600';
      } else {
        wm.innerText = 'BORRADOR · NO VALIDO PARA USO';
        wm.className = 'watermark-text text-amber-600';
      }

      const viewerArea = document.getElementById('pdfViewerArea');
      if (targetDoc.archivo_url) {
        viewerArea.innerHTML = `<iframe src="${targetDoc.archivo_url}" class="w-full h-[500px] border rounded"></iframe>`;
      } else {
        viewerArea.innerHTML = `
          <div class="p-6 text-center space-y-2">
            <div class="text-slate-400 text-3xl">📄</div>
            <div class="font-bold text-slate-700">Documento Digital en Sistema GxP</div>
            <p class="text-slate-500 text-[11px]">Versión oficial validada (${targetDoc.codigo} v${targetDoc.version}). Al adjuntar el archivo, se proyectará en este visor.</p>
          </div>
        `;
      }

      const qrImg = document.getElementById('pdfQrImage');
      if (qrImg) {
        const verifyData = encodeURIComponent(`PHARMOR-QMS:${targetDoc.codigo}:v${targetDoc.version}:${targetDoc.estado}`);
        qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${verifyData}`;
      }

      document.getElementById('pdfSignaturesTable').innerHTML = `
        <tr>
          <td class="border border-slate-300 p-1.5 font-bold">APROBO</td>
          <td class="border border-slate-300 p-1.5">Johan Aguilar (QA Lead)</td>
          <td class="border border-slate-300 p-1.5 font-bold text-emerald-700">✓ FIRMADO ELECTRONICAMENTE</td>
          <td class="border border-slate-300 p-1.5 font-mono">${new Date().toLocaleString('es-CO')}</td>
        </tr>
      `;

      document.getElementById('pdfSystemHash').innerText = `SHA256-${docId.substring(0,8).toUpperCase()}-${Date.now()}`;
      toggleModal('modalExportPdf', true);
    }

    // INICIALIZACIÓN SEGURA DE EVENTOS AL CARGAR EL DOM
    document.addEventListener('DOMContentLoaded', function() {
      const btnSecure = document.getElementById('btn-login-secure');
      const btnDev = document.getElementById('btn-login-dev');
      const btnLogout = document.getElementById('btn-logout');

      if (btnSecure) {
        btnSecure.addEventListener('click', function() {
          const email = document.getElementById('loginEmail').value;
          abrirPortal({ id: 'b40e33f1-6196-4b51-bfcb-6604d6daff50', nombre_completo: email || 'Johan Aguilar', cargo: 'QA Lead' });
        });
      }

      if (btnDev) {
        btnDev.addEventListener('click', function() {
          abrirPortal({ id: 'b40e33f1-6196-4b51-bfcb-6604d6daff50', nombre_completo: 'Johan Aguilar', cargo: 'QA Lead' });
        });
      }

      if (btnLogout) {
        btnLogout.addEventListener('click', function() {
          location.reload();
        });
      }

      // NAVEGACIÓN PESTAÑAS
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          const tabName = this.getAttribute('data-tab');
          document.querySelectorAll('.tab-content').forEach(v => v.classList.remove('active'));
          document.querySelectorAll('.nav-btn').forEach(b => {
            b.classList.remove('bg-cyan-600', 'text-white', 'font-bold');
            b.classList.add('hover:bg-slate-700');
          });
          const targetTab = document.getElementById('view-' + tabName);
          if (targetTab) targetTab.classList.add('active');
          this.classList.add('bg-cyan-600', 'text-white', 'font-bold');
          this.classList.remove('hover:bg-slate-700');
        });
      });

      // ACCIONES DINÁMICAS
      document.addEventListener('click', function(e) {
        const target = e.target.closest('.btn-action');
        if (!target) return;

        const action = target.getAttribute('data-action');
        const id = target.getAttribute('data-id');
        const code = target.getAttribute('data-code');
        const ver = target.getAttribute('data-ver');

        if (action === 'preview') {
          previewPdf(id);
        } else if (action === 'emitir') {
          window.selectedDocForCopia = { id, code, version: ver };
          const targetCode = document.getElementById('copiaTargetCode');
          if (targetCode) targetCode.innerText = `${code} v${ver}`;
          toggleModal('modalEmitirCopia', true);
        } else if (action === 'destruir') {
          const item = window.cachedCopias.find(c => c.id === id);
          if (item) {
            item.estado = 'DESTRUIDA';
            alert(`Copia ${item.codigo_copia} registrada como DESTRUIDA.`);
            renderAllData();
          }
        } else if (action === 'sign') {
          window.selectedDocId = id;
          const signCode = document.getElementById('signTargetCode');
          if (signCode) signCode.innerText = code;
          toggleModal('modalSign', true);
        } else if (action === 'version') {
          window.selectedDocForVersion = { id, code, version: ver };
          const verCode = document.getElementById('verTargetCode');
          const currentVer = document.getElementById('currentVer');
          const newVerNum = document.getElementById('newVerNumber');
          if (verCode) verCode.innerText = code;
          if (currentVer) currentVer.value = ver;
          if (newVerNum) {
            const vParts = ver.split('.');
            newVerNum.value = (parseInt(vParts[0]) + 1) + '.0';
          }
          toggleModal('modalVersion', true);
        }
      });

      // CIERRE Y APERTURA DE MODALES
      const modalsToClose = [
        ['btn-close-pdf', 'modalExportPdf'], ['btn-close-pdf-bottom', 'modalExportPdf'],
        ['btn-close-emitir', 'modalEmitirCopia'], ['btn-close-version', 'modalVersion'],
        ['btn-close-sign', 'modalSign'], ['btn-close-doc', 'modalDoc'],
        ['btn-close-user', 'modalUser'], ['btn-close-dev', 'modalDev'], ['btn-close-eqp', 'modalEqp']
      ];
      modalsToClose.forEach(([btnId, modalId]) => {
        const el = document.getElementById(btnId);
        if (el) el.addEventListener('click', () => toggleModal(modalId, false));
      });

      const modalsToOpen = [
        ['btn-open-modal-doc', 'modalDoc'], ['btn-open-modal-user', 'modalUser'],
        ['btn-open-modal-dev', 'modalDev'], ['btn-open-modal-eqp', 'modalEqp']
      ];
      modalsToOpen.forEach(([btnId, modalId]) => {
        const el = document.getElementById(btnId);
        if (el) el.addEventListener('click', () => toggleModal(modalId, true));
      });

      // IMPRESIÓN
      const printAction = () => window.print();
      ['btn-print-top', 'btn-print-bottom'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('click', printAction);
      });

      // CONFIRMAR EMITIR COPIA
      const btnConfirmEmitir = document.getElementById('btn-confirmar-emitir');
      if (btnConfirmEmitir) {
        btnConfirmEmitir.addEventListener('click', function() {
          const area = document.getElementById('copiaArea').value;
          const custodio = document.getElementById('copiaCustodio').value;
          if (!window.selectedDocForCopia) return;

          const nextNum = window.cachedCopias.length + 1;
          const nuevoCodigoCopia = `COP-${window.selectedDocForCopia.code}-C0${nextNum}`;

          window.cachedCopias.unshift({
            id: `c_${Date.now()}`,
            codigo_copia: nuevoCodigoCopia,
            documento_codigo: window.selectedDocForCopia.code,
            version: window.selectedDocForCopia.version,
            area_destino: area,
            custodio: custodio,
            fecha_emision: new Date().toISOString().split('T')[0],
            estado: 'ACTIVA'
          });

          toggleModal('modalEmitirCopia', false);
          const pdfCopiaCode = document.getElementById('pdfCopiaCode');
          const pdfCopiaArea = document.getElementById('pdfCopiaArea');
          const pdfCopiaCustodio = document.getElementById('pdfCopiaCustodio');
          if (pdfCopiaCode) pdfCopiaCode.innerText = nuevoCodigoCopia;
          if (pdfCopiaArea) pdfCopiaArea.innerText = area;
          if (pdfCopiaCustodio) pdfCopiaCustodio.innerText = custodio;
          
          previewPdf(window.selectedDocForCopia.id);
          renderAllData();
        });
      }

      // CONFIRMAR NUEVA VERSIÓN Y SUBIDA A STORAGE
      const btnConfirmVersion = document.getElementById('btn-confirmar-version');
      if (btnConfirmVersion) {
        btnConfirmVersion.addEventListener('click', async function() {
          const newVersion = document.getElementById('newVerNumber').value;
          const reason = document.getElementById('changeReason').value;

          if (!newVersion || !reason) {
            alert('Debes definir la nueva versión y justificar el cambio.');
            return;
          }

          const fileUrl = await subirArchivoSupabase('newVerFile', window.selectedDocForVersion.code, newVersion);

          const targetDoc = window.cachedDocs.find(d => d.id === window.selectedDocForVersion.id);
          if (targetDoc) {
            window.cachedDocs.unshift({
              id: `doc_${Date.now()}`,
              codigo: targetDoc.codigo,
              titulo: targetDoc.titulo,
              tipo: targetDoc.tipo,
              version: newVersion,
              estado: 'En Revisión',
              created_at: new Date().toISOString().split('T')[0],
              archivo_url: fileUrl,
              justificacion_cambio: reason
            });
          }

          if (window.selectedDocForVersion) {
            window.cachedCopias.forEach(c => {
              if (c.documento_codigo === window.selectedDocForVersion.code && c.estado === 'ACTIVA') {
                c.estado = 'PENDIENTE DE RETIRO';
              }
            });
          }

          alert(`Nueva versión v${newVersion} creada y archivo vinculado con éxito desde Supabase Storage.`);
          toggleModal('modalVersion', false);
          renderAllData();
        });
      }

      // CONFIRMAR FIRMA
      const btnConfirmSign = document.getElementById('btn-confirmar-sign');
      if (btnConfirmSign) {
        btnConfirmSign.addEventListener('click', function() {
          const pin = document.getElementById('signPin').value;
          if (pin !== '1234') {
            alert('PIN incorrecto (PIN de prueba: 1234)');
            return;
          }
          alert('Firma estampada con éxito (21 CFR Part 11)');
          toggleModal('modalSign', false);
        });
      }
    });
  </script>
